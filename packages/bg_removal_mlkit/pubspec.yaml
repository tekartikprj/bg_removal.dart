name: tekartik_bg_removal_mlkit
description: Background removal engine on Android - ML Kit Subject Segmentation (Play services), foreground mask, guarded against native crashes.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  tekartik_bg_removal:
    path: ../bg_removal
  google_mlkit_subject_segmentation: ">=0.2.1"
  path_provider: ">=2.1.6"
  path: ">=1.9.1"

dev_dependencies:
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

resolution: workspace
