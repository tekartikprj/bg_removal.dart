name: tekartik_bg_removal_onnx
description: Background removal engine on ONNX Runtime - MODNet (person) and u2netp or IS-Net (salient), models downloaded once and checked by sha256.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  tekartik_bg_removal:
    path: ../bg_removal
  flutter_onnxruntime: ">=1.9.0"
  path_provider: ">=2.1.6"
  path: ">=1.9.1"
  http: ">=1.6.0"
  crypto: ">=3.0.8"

dev_dependencies:
  flutter_test:
    sdk: flutter
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

resolution: workspace
