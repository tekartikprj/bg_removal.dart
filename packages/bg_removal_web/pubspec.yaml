name: tekartik_bg_removal_web
description: Background removal engine for the web - MODNet and u2netp (or IS-Net) on onnxruntime-web (wasm or WebGPU) through js interop, models cached in the browser.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

platforms:
  web:

dependencies:
  tekartik_bg_removal:
    path: ../bg_removal
  web: ">=1.1.0"

dev_dependencies:
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints

resolution: workspace
