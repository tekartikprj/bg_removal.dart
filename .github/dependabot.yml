# Dependabot configuration file.
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2

enable-beta-ecosystems: true

updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pub"
    directory: "example/bg_removal_example"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pub"
    directory: "bench/bg_removal_bench"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pub"
    directory: "bench/bg_removal_bench_web"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
