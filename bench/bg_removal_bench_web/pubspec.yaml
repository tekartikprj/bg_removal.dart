name: bg_removal_bench_web
description: "The bench of the background removal web engine (onnxruntime-web) on fixtures with reference masks, in headless Chrome."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Material widgets (package:flutter/material.dart is deprecated).
  material_ui: ">=1.5.0"

  # The bench and its fixtures, shared with the Android app.
  bg_removal_bench_common:
    path: ../bg_removal_bench_common
  # The packages: the pipeline and the web engine (onnxruntime-web).
  tekartik_bg_removal_flutter:
    path: ../../packages/bg_removal_flutter
  tekartik_bg_removal_web:
    path: ../../packages/bg_removal_web
  web: ">=1.1.0"

dev_dependencies:
  # tool/bench.dart
  path: ">=1.9.1"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

flutter:
  uses-material-design: true
