name: bg_removal_bench_common
description: "Shared by the background removal benches: the runner, the report, the fixtures and the page. Depends on no engine."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  tekartik_bg_removal:
    path: ../../packages/bg_removal
  tekartik_bg_removal_flutter:
    path: ../../packages/bg_removal_flutter
  # JPEG of the timing photo.
  image: ">=4.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

flutter:
  assets:
    - assets/fixtures/

resolution: workspace
